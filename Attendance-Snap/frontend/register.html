<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="auth"><a class="brand" href="/">📸 Attendance Snap</a><section class="card"><h1>Create account</h1><form id="register"><label>Full name<input name="name" maxlength="100" required></label><label>Email<input name="email" type="email" required></label><label>Password (8+ characters)<input name="password" type="password" minlength="8" required></label><label>Account type<select name="role"><option value="student">Student</option><option value="teacher">Teacher</option></select></label><label>Avatar style<select name="avatar"><option value="male">Male-style 👨‍🎓</option><option value="female">Female-style 👩‍🎓</option><option value="neutral">Neutral 🧑‍🎓</option></select></label><label>Class / section (optional)<input name="class_name" maxlength="80" placeholder="e.g. 3rd CSE-A"></label><button class="btn">Create account</button><p id="notice" class="notice"></p></form><p>Already registered? <a href="/login">Sign in</a></p><small>Avatar style is selected by the user, never inferred from a face.</small></section></main><script src="/static/app.js"></script></body></html>
